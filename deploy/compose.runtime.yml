# The rover's own compose file. Unlike .devcontainer/docker-compose.yml there is no bind
# mount of the source: the image carries its compiled workspace, so this file plus the
# image is the whole deployment.
#
# Restarts are left to Docker rather than systemd so the two don't fight. The launch file
# already restarts individual nodes and shuts the graph down if a motor-commanding node
# dies; when that happens the container exits and Docker brings it back, with Docker's
# own backoff keeping a persistent fault from turning into a hot loop.

services:
    viator:
        image: viator:runtime
        container_name: viator-rover
        user: trickfire

        restart: unless-stopped

        # ROS 2 discovery and rosbridge's listener both expect to be on the host's network
        network_mode: host

        # CAN needs NET_ADMIN/NET_RAW and the cameras need /dev/video*. Privileged is the
        # blunt way to get both; see the note in .devcontainer/trickfire-can.sudoers for
        # why the can_rmdx8 node still goes through sudo even so.
        privileged: true

        volumes:
            # Keep ROS's own logs on the host. Without this they live inside the container
            # and are gone the moment it restarts, which is exactly when you want them.
            - type: bind
              source: /var/log/viator
              target: /home/trickfire/.ros/log
              bind:
                  create_host_path: true

        command: ["launch"]
