name: Code Style

on: [push, pull_request]

jobs:
    python:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: 3.10.12

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff==0.15.21

            - name: Run Ruff check
              run: ruff check --output-format=github ./src

            - name: Run Ruff format check
              run: ruff format --check ./src

            - name: Install Mypy
              run: pip install mypy==1.11.2 moteus

            - name: Run Mypy
              run: mypy --exclude /test/ --exclude setup\.py --exclude vision_opencv ./src

    shell:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install shfmt
              uses: mfinelli/setup-shfmt@v4

            - name: Check shell formatting
              run: shfmt -i 4 -s -d scripts/ .devcontainer/ deploy/
