services:
    viator:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: dev
        image: viator:dev
        container_name: viator
        user: trickfire

        volumes:
            - ..:/home/trickfire/viator
            # - /dev/video0:/dev/video0
            - type: bind
              source: ${HOME}/.ssh
              target: /home/trickfire/.ssh
              read_only: true
              bind:
                  create_host_path: true

        working_dir: /home/trickfire/viator

        network_mode: host

        privileged: true
        security_opt:
            - seccomp:unconfined

        stdin_open: true
        tty: true
