# the base compose for the devcontainer
# overlay with the rover compose for rover
services:
    viator:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: dev
        image: viator:dev
        container_name: viator
        user: trickfire

        volumes:
            - ..:/home/trickfire/viator

        working_dir: /home/trickfire/viator
        network_mode: host
        stdin_open: true
        tty: true
